  /groups:
    get:
      tags:
        - OTS Groups
      summary: List OTS groups (admin) 🔒
      description: OTS groups synced into the portal, sorted by name. Returns every group unless per_page is given.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: Page size; omit to return all groups
          schema:
            type: integer
        - name: search
          in: query
          description: Search name, display name or description
          schema:
            type: string
      responses:
        '200':
          description: List of OTS groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        displayName:
                          type: string
                        description:
                          type: string
                        active:
                          type: boolean
                        syncedAt:
                          type: string
                          format: date-time
                          nullable: true
                        missingInOts:
                          type: boolean
                          description: True when the last sync did not find the group in OpenTAK Server
                        missingSince:
                          type: string
                          format: date-time
                          nullable: true
                        userCount:
                          type: integer
                        onboardingCodeCount:
                          type: integer
                  total:
                    type: integer
                  page:
                    type: integer
                  per_page:
                    type: integer
                    nullable: true
        '403':
          description: Group admin or readonly role required

  /groups/sync:
    post:
      tags:
        - OTS Groups
      summary: Sync groups from OTS (group admin) 🔒
      description: >
        Imports groups from OpenTAK Server. Groups that are no longer in OTS are flagged
        (missingInOts), never deleted. The missing-group check only runs on a complete list;
        otherwise nothing is flagged or cleared and missingCheckSkipped holds the reason.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  synced:
                    type: integer
                  created:
                    type: integer
                  updated:
                    type: integer
                  markedMissing:
                    type: integer
                  markedMissingGroups:
                    type: array
                    items:
                      type: string
                  restored:
                    type: integer
                  restoredGroups:
                    type: array
                    items:
                      type: string
                  missingTotal:
                    type: integer
                    description: Groups currently flagged as missing in OTS
                  missingCheckSkipped:
                    type: string
                    nullable: true
                    enum: [incomplete, empty, malformed, invalid]
                    description: Why the missing-group check did not run (null when it ran)
        '400':
          description: Sync failed
        '403':
          description: Group admin role required
        '503':
          description: OTS not reachable

  /groups/{id}/members:
    post:
      tags:
        - OTS Groups
      summary: Add or change a group member (group admin) 🔒
      description: >
        Reads the user's current directions in the group from OTS, sets them to the requested
        direction there, then sets the local membership to that direction.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
                username:
                  type: string
                direction:
                  type: string
                  enum: [IN, OUT, BOTH]
      responses:
        '200':
          description: Member set
        '400':
          description: Invalid direction, no username or userId, or the local update failed
        '403':
          description: Group admin role required
        '404':
          description: Group or user not found
        '409':
          description: The group is flagged as missing in OTS
        '502':
          description: >
            OTS did not accept the change, or the group's member list could not be read from OTS
            (`failedGroups` is set). The portal was not changed and the memberships already changed
            in OTS are put back; `otsMayDiffer` is true if that failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  failedGroups:
                    type: array
                    items:
                      type: string
                  otsMayDiffer:
                    type: boolean

  /groups/{id}/members/{username}:
    delete:
      tags:
        - OTS Groups
      summary: Remove a group member for a direction (group admin) 🔒
      description: >
        Reads the user's current directions in the group from OTS, removes the requested ones there
        (an OTS 404 counts as already gone), then sets the local membership to the directions OTS has left.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: direction
          in: query
          schema:
            type: string
            enum: [IN, OUT, BOTH]
            default: BOTH
      responses:
        '200':
          description: Member removed
        '400':
          description: Invalid direction, or the local update failed
        '403':
          description: Group admin role required
        '404':
          description: Group not found
        '502':
          description: >
            OTS did not accept the change, or the group's member list could not be read from OTS
            (`failedGroups` is set). The portal was not changed and the memberships already changed
            in OTS are put back; `otsMayDiffer` is true if that failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  failedGroups:
                    type: array
                    items:
                      type: string
                  otsMayDiffer:
                    type: boolean

  /groups/{id}:
    get:
      tags:
        - OTS Groups
      summary: Get an OTS group with its members and usage (admin) 🔒
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Group details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  displayName:
                    type: string
                  description:
                    type: string
                  active:
                    type: boolean
                  syncedAt:
                    type: string
                    format: date-time
                    nullable: true
                  missingInOts:
                    type: boolean
                  missingSince:
                    type: string
                    format: date-time
                    nullable: true
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        username:
                          type: string
                        callsign:
                          type: string
                        email:
                          type: string
                  onboardingCodes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                  eventTeams:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
        '403':
          description: Group admin or readonly role required
        '404':
          description: Group not found
    delete:
      tags:
        - OTS Groups
      summary: Remove an OTS group (group admin) 🔒
      description: >
        A group flagged as missing in OTS is only removed from the portal (force removal).
        Otherwise it is deleted in OTS first (an OTS 404 counts as already gone); any other OTS
        failure returns 502 and keeps the local group. User and onboarding-code assignments are
        removed with the group and event teams are detached from it.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Group removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  removedFromOts:
                    type: boolean
                  affected:
                    type: object
                    properties:
                      memberCount:
                        type: integer
                      onboardingCodes:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                      eventTeams:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
        '403':
          description: Group admin role required
        '404':
          description: Group not found
        '502':
          description: Deleting the group in OTS failed; the local group is kept

