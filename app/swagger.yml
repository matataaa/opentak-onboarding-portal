                  ots_hostname:
                    type: string
                  ots_url:
                    type: string
                  itak_homepage_icon_enabled:
                    type: boolean
                  truststore_homepage_icon_enabled:
                    type: boolean
                  enable_repo:
                    type: boolean
                  enable_claim_radio:
                    type: boolean
                  forgot_password_enabled:
