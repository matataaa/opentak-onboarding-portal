openapi: 3.0.3
info:
  title: OpenTAK Onboarding Portal API
  description: |
    RESTful API for the OpenTAK Onboarding Portal.

    ## Authentication
    Most endpoints require JWT authentication. Use the `/auth/login` endpoint to obtain access and refresh tokens.

    Include the access token in the Authorization header:
    ```
    Authorization: Bearer <access_token>
    ```

    Event leader sessions (tokens issued by `/events/join/{token}` for a leader link) are
    deny-by-default: they may only call the `/events/my-team*` endpoints, `/auth/refresh`,
    `/auth/me` and `/auth/permissions`. Every other endpoint returns 403.
    Each leader join names the person (`displayName`) and creates a leader session row
    whose id is carried in the token claim `event_leader_session`; an admin can revoke one
    session via `/events/{id}/leader-sessions/{sessionId}/revoke`. Leader tokens issued
    before this claim existed are no longer accepted (401/403): the leader joins again
    through the leader link.

    Personal leaders are portal users designated as leader of a team for one event
    (by an admin via `/events/{id}/team-leaders`, or by scanning the team's leader link
    while logged in). They keep their normal session and rights and may call the
    `/events/my-team*` endpoints with it while the designation is valid (events enabled,
    event active and open, the team has a link in the event and, for designations made
    by scanning, the leader link has not been regenerated or deleted since; the user is
    not expired and is not a team's shared leader account). With more
    than one valid designation they pass the query parameters `eventId` and `teamId`.

    ## Switchable modules
    The Meshtastic, radios and events modules can be turned off with the settings
    `meshtastic_enabled`, `radios_enabled` (both default on) and `events_enabled`
    (default off). While a module is off, every endpoint under its path prefix
    (`/meshtastic*`, `/radios*`, `/events*`) returns 403 for every caller, including
    administrators and anonymous requests:
    ```
    {"error": "The meshtastic module is disabled", "code": "MODULE_DISABLED"}
    ```
    `/radios/enroll`, `/radios/{id}/program-config` and `/radios/{id}/compare-config`
    also need the Meshtastic module. `/settings`, `/admin/settings*` and `/auth/*` are
    never affected, and disabled modules are left out of `/auth/permissions`.

    ## Permissions
    Admin endpoints check permissions per function (`/auth/permissions` lists yours). A write can
    hold fields you have no permission for, because a form sends its whole record: those fields
    have no effect, and the response names them in `ignoredFields` (left out when there are none).
    This goes for `POST`/`PUT` on `/users`, `/onboarding-codes`, `/radios`, `/tak-profiles` and
    `/events/teams`. `GET /groups/{id}` only has `users` with `groups.members.view`; the admin
    Meshtastic group routes answer `url` and `combined_url` as null without
    `meshtastic.channels.view`.

    ## Admin Endpoints
    Endpoints marked with 🔒 require the 'administrator' role.
  version: 1.0.0
  contact:
    name: OpenTAK Onboarding Portal

servers:
  - url: http://localhost:5000/api/v1
    description: Development server
  - url: /api/v1
    description: Production server (relative)

tags:
  - name: Authentication
    description: User authentication and authorization
  - name: Users
    description: User management (admin only)
  - name: Roles
    description: Role management
  - name: Onboarding Codes
    description: Onboarding code management
  - name: TAK Profiles
    description: TAK profile management and downloads
  - name: Meshtastic
    description: Meshtastic radio configuration management
  - name: OTS Groups
    description: OTS group (channel) management
  - name: Radios
    description: Radio device inventory management
  - name: Packages
    description: ATAK package management
  - name: Settings
    description: System settings management (admin only)
  - name: Announcements
    description: Announcement management (admin or announcement_admin / announcement_readonly)
  - name: Events
    description: Events module (events_admin / events_readonly)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /auth/login

  parameters:
    LeaderEventId:
      name: eventId
      in: query
      required: false
      description: >
        Personal leaders only (ignored for shared leader sessions): the event of the team
        to act for; needed when the user has more than one valid designation
      schema:
        type: integer
    LeaderTeamId:
      name: teamId
      in: query
      required: false
      description: >
        Personal leaders only (ignored for shared leader sessions): the team to act for
        (on the move endpoint this query parameter is the own team, the body teamId the target)
      schema:
        type: integer

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        callsign:
          type: string
        roles:
          type: array
          items:
            type: string
        expiryDate:
          type: string
          format: date-time
          nullable: true
        onboardedBy:
          type: integer
          nullable: true

    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        displayName:
          type: string
          nullable: true
        isProtected:
          type: boolean
          description: The name and description cannot be changed or the role deleted (built-in, from OTS)
        isCustom:
          type: boolean
          description: Can be given permissions (not a built-in, reserved or OTS role)
        locked:
          type: boolean
          description: The current user cannot change this role's permissions (see lockedReason)
        lockedReason:
          type: string
          nullable: true
          enum: [system, aboveLevel, null]
          description: system = not a custom role; aboveLevel = the role holds permissions the current user does not hold (read-only for them, including rename and delete)
        assignable:
          type: boolean
          description: Everything this role holds is held by the current user, so they may hand it out
        permissions:
          type: array
          items:
            type: string
          description: Only for holders of roles.view. Computed for a built-in, the stored rows for a custom role
        userCount:
          type: integer
          description: Only for holders of roles.view
        codeCount:
          type: integer
          description: Onboarding codes carrying this role. Only for holders of roles.view

    PermissionCatalogKey:
      type: object
      properties:
        key:
          type: string
        level:
          type: string
          enum: [view, edit, action]
        readonlyDefault:
          type: boolean
          description: Part of the module's read-only built-in role
        sensitive:
          type: boolean
        administratorOnly:
          type: boolean
          description: Cannot be given to a custom role
        requires:
          type: array
          items:
            type: string
          description: Keys this key needs to count at all, including the view key an edit key implies
        grantable:
          type: boolean
          description: The current user may give this key to a role

    RolePermissionsRequest:
      type: object
      required:
        - permissions
      properties:
        permissions:
          type: array
          items:
            type: string
          description: The full list; an edit key is stored with the view key it implies

    RolePermissionImpact:
      type: object
      properties:
        added:
          type: array
          items:
            type: string
        removed:
          type: array
          items:
            type: string
        userCount:
          type: integer
          description: Users holding the role, if anything changes
        codeCount:
          type: integer
          description: Onboarding codes carrying the role, if anything changes

    OnboardingCode:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        onboardingCode:
          type: string
        uses:
          type: integer
        maxUses:
          type: integer
          nullable: true
        validFrom:
          type: string
          format: date-time
          nullable: true
        expiryDate:
          type: string
          format: date-time
          nullable: true
        userExpiryDate:
          type: string
          format: date-time
          nullable: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    TakProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        isPublic:
          type: boolean

    Meshtastic:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        url:
          type: string
        isPublic:
          type: boolean
        defaultRadioConfig:
          type: boolean
        showOnHomepage:
          type: boolean

    Radio:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        platform:
          type: string
        radioType:
          type: string
          enum: [meshtastic, other]
        description:
          type: string
        mac:
          type: string

    Package:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        platform:
          type: string
        typePackage:
          type: string
        description:
          type: string
        version:
          type: string

    Setting:
      type: object
      properties:
        id:
          type: integer
        key:
          type: string
          description: Unique identifier for the setting
        value:
          type: string
          description: The value of the setting (string representation)
        category:
          type: string
          description: Category grouping (e.g., "notifications", "email", "security")
        description:
          type: string
          description: Human-readable description of what this setting does

    AnnouncementEmailStatus:
      type: object
      description: |
        Email delivery state. `status` of the announcement itself only says whether it is
        published in-app; mail is delivered separately by a background job with retries.
      properties:
        emailStatus:
          type: string
          nullable: true
          enum: [pending, sent, failed, skipped]
          description: null when sendEmail is false
        emailAttempts:
          type: integer
          description: Number of failed delivery runs so far (terminal "failed" after 6)
        emailLastError:
          type: string
          nullable: true
          description: Hidden (null) for the announcement_readonly role
        emailNextAttemptAt:
          type: string
          format: date-time
          nullable: true
        emailPendingCount:
          type: integer
          description: Recipients still owed a mail
        emailFailureCount:
          type: integer
          description: Recipients dropped because their address was refused

    AnnouncementEmailRecipient:
      type: object
      properties:
        userId:
          type: integer
        username:
          type: string
          nullable: true
          description: null when the user no longer exists
        email:
          type: string
          nullable: true
          description: Hidden (null) for the announcement_readonly role
        error:
          type: string
          nullable: true
          description: Only for dropped (refused) recipients; hidden (null) for the announcement_readonly role

    AnnouncementSummary:
      allOf:
        - $ref: '#/components/schemas/AnnouncementEmailStatus'
        - type: object
          properties:
            id:
              type: integer
            title:
              type: string
            content:
              type: string
            targetType:
              type: string
              enum: [all, roles, users]
            status:
              type: string
              enum: [draft, scheduled, sent]
            sendEmail:
              type: boolean
            scheduledAt:
              type: string
              format: date-time
              nullable: true
            sentAt:
              type: string
              format: date-time
              nullable: true
            createdAt:
              type: string
              format: date-time
            readCount:
              type: integer
            totalTargeted:
              type: integer

    AnnouncementDetail:
      allOf:
        - $ref: '#/components/schemas/AnnouncementEmailStatus'
        - type: object
          properties:
            id:
              type: integer
            title:
              type: string
            content:
              type: string
            targetType:
              type: string
              enum: [all, roles, users]
            status:
              type: string
              enum: [draft, scheduled, sent]
            sendEmail:
              type: boolean
            scheduledAt:
              type: string
              format: date-time
              nullable: true
            sentAt:
              type: string
              format: date-time
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            createdBy:
              type: object
              nullable: true
              properties:
                id:
                  type: integer
                username:
                  type: string
            targetRoles:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  displayName:
                    type: string
            targetUsers:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  username:
                    type: string
            stats:
              type: object
              properties:
                totalReads:
                  type: integer
                emailOpens:
                  type: integer
                totalTargeted:
                  type: integer
            reads:
              type: array
              items:
                type: object
                properties:
                  userId:
                    type: integer
                  username:
                    type: string
                  readAt:
                    type: string
                    format: date-time
                  emailOpened:
                    type: boolean
                  emailOpenedAt:
                    type: string
                    format: date-time
                    nullable: true
            emailPending:
              type: array
              items:
                $ref: '#/components/schemas/AnnouncementEmailRecipient'
            emailFailures:
              type: array
              description: Recipients dropped because their address was refused
              items:
                $ref: '#/components/schemas/AnnouncementEmailRecipient'

    EventLink:
      type: object
      properties:
        id:
          type: integer
        eventId:
          type: integer
        eventTeamId:
          type: integer
        team:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
        role:
          type: string
          enum: [leader, player]
        direction:
          type: string
          enum: [BOTH, IN, OUT]
          description: >
            How the device accounts of this link take part in their team's OTS group:
            BOTH (send and receive), IN (send only) or OUT (receive only). The other
            side goes to the event's parked sink group, so the device never falls back
            to __ANON__. A player link's direction applies to the shared-mode devices that
            join through it, a leader link's to the leader's own devices.
        tokenVersion:
          type: integer
        retrievable:
          type: boolean
          description: Whether this viewer can get the join URL again; false when the code carries a role with permissions the viewer does not hold
        onboardingCodeId:
          type: integer
          nullable: true
        onboardingCode:
          type: object
          nullable: true
          description: id, name and onboardingCode; the value of onboardingCode is null when the code carries a role with permissions the viewer does not hold
        createdAt:
          type: string
          format: date-time
        token:
          type: string
          description: Only returned when the token is generated or regenerated
        url:
          type: string
          description: Only returned when the token is generated or regenerated

    EventLeaderSession:
      type: object
      description: >
        One person who joined through a leader link (shared leader account), or a
        personal leader (own portal account)
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [link, account]
          description: link = shared leader account; account = personal leader (userId set)
        username:
          type: string
          nullable: true
          description: The personal leader's portal username (null for kind link)
        eventId:
          type: integer
        eventTeamId:
          type: integer
        team:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
        eventLinkId:
          type: integer
          nullable: true
          description: The leader link joined through; kept after the link is deleted
        displayName:
          type: string
          maxLength: 80
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
          description: Set by a revoke, and when the link is regenerated or deleted
        revokedBy:
          type: integer
          nullable: true
          description: Local user id of the admin who revoked it
        deviceCount:
          type: integer
          description: Open device accounts this leader session created
        status:
          type: string
          enum: [active, ended, revoked]
          description: >
            revoked = revokedAt is set; ended = the session no longer works for another
            reason (event inactive/not open, leader link gone, or the team has no leader
            account any more; a leader account swapped for another one is not detected;
            for kind account: the designation is removed or no longer valid);
            else active

    EventTeamLeader:
      type: object
      description: A portal user designated as leader of a team for one event (personal leader)
      properties:
        id:
          type: integer
        eventId:
          type: integer
        eventTeamId:
          type: integer
        team:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
        userId:
          type: integer
        user:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            username:
              type: string
            callsign:
              type: string
              nullable: true
        source:
          type: string
          enum: [admin, link]
          description: >
            admin = designated by an admin; link = the user scanned the team's leader link
            while logged in (ends when that link is regenerated or deleted)
        eventLinkId:
          type: integer
          nullable: true
          description: The leader link a source link designation is bound to
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: integer
          nullable: true
        status:
          type: string
          enum: [active, ended]
          description: >
            active while the designation gives access to the team page (ended also when
            the user has expired or became a team's shared leader account)

    Event:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        validFrom:
          type: string
          format: date-time
          nullable: true
        validUntil:
          type: string
          format: date-time
          nullable: true
        playerAccessMode:
          type: string
          enum: [shared, individual]
        accountCleanup:
          type: string
          enum: [deactivate, delete]
        active:
          type: boolean
        organizerTeamId:
          type: integer
          nullable: true
          description: >
            The organizer (HQ) team: a team with a link in this event. Its shared-mode
            device accounts get organizerDirection on the group of every other team of
            the event (teams with a link and a usable OTS group), next to their own
            team group membership. In individual mode it has no effect (set HQ up via
            its onboarding code).
        organizerDirection:
          type: string
          enum: [BOTH, IN, OUT]
          default: OUT
          description: >
            How HQ devices take part in the other teams' groups. OUT (default) = HQ
            sees every team, the teams do not see HQ; BOTH = the teams also see HQ
            (orders); IN = HQ only sends to the teams. Teams never see each other.
        createdAt:
          type: string
          format: date-time
          nullable: true

    ReprovisionCounts:
      type: object
      properties:
        reprovisioned:
          type: integer
          description: Open device accounts whose OTS groups were changed
        reprovisionFailed:
          type: integer
          description: >
            Open device accounts that kept their old OTS groups (OTS failure); they are
            retried by saving again

paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate with username and password to receive JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  format: password
                  example: password
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: JWT access token (12 hour expiry)
                  refresh_token:
                    type: string
                    description: JWT refresh token (30 day expiry)
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Get a new access token using a refresh token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
        '401':
          description: Invalid or expired refresh token

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Get the authenticated user's profile information
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated

  /auth/permissions:
    get:
      tags:
        - Authentication
      summary: Get the current user's roles, accessible admin modules, permissions and leader teams
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items:
                      type: string
                  modules:
                    type: array
                    items:
                      type: string
                  permissions:
                    type: array
                    description: >
                      The user's permission keys (see app/permissions.py), leaving out those of
                      disabled modules. Empty for kiosk and event-leader sessions.
                    items:
                      type: string
                  isAdmin:
                    type: boolean
                  leaderDesignations:
                    type: array
                    description: >
                      The valid personal leader designations of the user (empty for shared
                      leader and kiosk sessions)
                    items:
                      type: object
                      properties:
                        eventId: {type: integer}
                        eventName: {type: string}
                        teamId: {type: integer}
                        teamName: {type: string}
                        hq:
                          type: boolean
                          description: The team is the event's organizer (HQ) team
        '401':
          description: Not authenticated

  /auth/set-password:
    post:
      tags:
        - Authentication
      summary: Set initial password
      description: >
        Set the first password for an OIDC-created user that has none yet, and create
        their OTS account with it (as administrator if the user holds a privileged role)
        in the groups already assigned to the user in the portal.
        Never resets an existing OTS account's password.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newPassword
              properties:
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  description: 'Printable ASCII only. Not allowed: `& ^ $ < > : @` or a space at the start or end.'
      responses:
        '200':
          description: Password set and OTS account created
        '400':
          description: Invalid password, or OTS rejected the account
        '403':
          description: This is the portal service account (OTS_USERNAME)
        '409':
          description: >
            Password already set (`code`: `password_already_set`; use change-password),
            or the username already exists on the TAK server (`code`: `username_taken_on_server`)
        '502':
          description: >
            OTS returned an unexpected error. Or OTS did not accept one of the user's group memberships
            (`code`: `ots_groups_refused`, `failedGroups` is set): the memberships already added and the
            new OTS account are removed again and the password is not set; `otsMayDiffer` is true if
            deleting the OTS account failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                  failedGroups:
                    type: array
                    items:
                      type: string
                  otsMayDiffer:
                    type: boolean
        '503':
          description: TAK server unreachable

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request a password reset email
      description: Always answers the same. No token or email is produced for the portal service account (OTS_USERNAME).
      responses:
        '200':
          description: If the account exists, reset instructions are sent

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset a password with a token
      responses:
        '200':
          description: Password reset
        '400':
          description: Missing, invalid or expired token, or a disallowed password
        '403':
          description: This is the portal service account (OTS_USERNAME)

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: Register a new user account with an onboarding code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
                - email
                - firstName
                - lastName
                - callsign
                - onboardingCode
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: 'Printable ASCII only. Not allowed: `& ^ $ < > : @` or a space at the start or end.'
                email:
                  type: string
                  format: email
                firstName:
                  type: string
                lastName:
                  type: string
                callsign:
                  type: string
                onboardingCode:
                  type: string
                language:
                  type: string
                  enum: [en, nl, de]
                  description: Initial profile language of the new account (the UI language used to register). Other values are ignored (default en). Stored on the pending registration and applied when the account is created (auto-approve, email verification or approval).
      responses:
        '201':
          description: User created successfully
        '400':
          description: Invalid input or onboarding code

  /auth/change-password:
    post:
      tags:
        - Authentication
      summary: Change password
      description: Change password for authenticated user. The current password is verified against OTS first.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  description: 'Printable ASCII only. Not allowed: `& ^ $ < > : @` or a space at the start or end.'
      responses:
        '200':
          description: Password changed successfully
        '400':
          description: Missing current/new password, new password shorter than 8 characters or with disallowed characters, or the account has no password yet (use set-password)
        '403':
          description: Current password is incorrect, or this is the portal service account (OTS_USERNAME)
        '502':
          description: OTS could not verify the current password or change it
        '503':
          description: OTS server unreachable

  /events:
    post:
      tags:
        - Events
      summary: Create an event (events_admin only) 🔒
      description: >
        An event with playerAccessMode `shared` requires `validUntil`; the device
        accounts it creates expire with the event. organizerTeamId can only be set
        with PUT once the team has a link in the event.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                description: {type: string, nullable: true}
                validFrom: {type: string, format: date-time, nullable: true}
                validUntil: {type: string, format: date-time, nullable: true}
                playerAccessMode: {type: string, enum: [shared, individual], default: individual}
                accountCleanup: {type: string, enum: [deactivate, delete], default: deactivate}
                active: {type: boolean, default: true}
                organizerDirection: {type: string, enum: [BOTH, IN, OUT], default: OUT}
                organizerTeamId:
                  type: integer
                  nullable: true
                  description: Must be null (or absent) here
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: >
            Invalid input, playerAccessMode `shared` without validUntil, invalid
            organizerDirection, or an organizerTeamId

  /events/{id}:
    put:
      tags:
        - Events
      summary: Update an event (events_admin only) 🔒
      description: >
        All fields are optional. When organizerTeamId or organizerDirection is
        submitted, the open, unparked, unexpired device accounts of the old and new
        organizer (HQ) team are re-provisioned in OTS right away, best effort per
        account (organizerTeamId null removes the organizer memberships). OTS
        failures never fail the request; submitting the same values again retries
        the accounts that failed (the periodic event job also retries them).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                description: {type: string, nullable: true}
                validFrom: {type: string, format: date-time, nullable: true}
                validUntil: {type: string, format: date-time, nullable: true}
                playerAccessMode: {type: string, enum: [shared, individual]}
                accountCleanup: {type: string, enum: [deactivate, delete]}
                active: {type: boolean}
                organizerTeamId:
                  type: integer
                  nullable: true
                  description: A team with a link in this event and a usable OTS group, or null
                organizerDirection: {type: string, enum: [BOTH, IN, OUT]}
      responses:
        '200':
          description: >
            Event updated; with organizerTeamId or organizerDirection in the body also
            the reprovision counts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Event'
                  - $ref: '#/components/schemas/ReprovisionCounts'
        '400':
          description: >
            Invalid input, the result would be a shared event without validUntil,
            organizerDirection not one of BOTH, IN, OUT, or organizerTeamId not a team
            with a link in this event and a usable OTS group
        '404':
          description: Event not found

  /events/join/{token}:
    post:
      tags:
        - Events
      summary: Join an event through a link token (public)
      description: >
        The link token is the credential. Leader links return a bounded leader session
        (access_token/refresh_token). Player links in individual mode return the
        onboarding code to register with. Player links in shared mode provision one OTS
        account per device and return a single-use ATAK enrollment string valid about
        15 minutes (or until the event ends). On the first call the server sets an
        HttpOnly, SameSite=Lax cookie `event_device_key` (Secure over HTTPS, Path = this
        endpoint) that identifies the device; a reload with that cookie keeps the same
        account and returns a fresh enrollment string instead of creating a new account.
        A cookie issued for another link is ignored. The response never contains a
        password. Leader links need `displayName` (who is joining, 1-80 characters after
        trimming); every leader join creates its own leader session (see
        `/events/{id}/leader-sessions`), carried in the token claim `event_leader_session`.
        A leader link sent with the access token of a normal user session (not a shared
        leader session, not a kiosk session, not a team's shared leader account) instead
        makes that user a personal leader of the team (see `/events/{id}/team-leaders`,
        source `link`, bound to the link's current version) and returns
        mode `leader-account` with a redirect; no tokens are issued and no displayName is
        needed. An invalid or expired token is 401; an expired user account or an
        impersonation session is 403. Counts towards the leader join throttle.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  maxLength: 80
                  description: Required for leader links, ignored for player links
      responses:
        '200':
          description: >
            Shared player - role, mode, team, event, expiresAt, atak ({qrString, expiresAt})
            and itak (best effort, may be null). Leader - role, access_token, refresh_token,
            expiresAt, team, event, user and leaderName. Leader link with a normal user
            session - role, mode `leader-account`, redirect (`/events/my-team?eventId=..&teamId=..`),
            team and event
        '400':
          description: >
            Leader link without a valid displayName (missing, empty, longer than 80
            characters or with control characters): code `display_name_required`, no
            session is created
        '403':
          description: >
            Events disabled, event inactive, not started or ended; or, for a leader link
            sent with a normal user session, the user account has expired or the session
            is an impersonation
        '404':
          description: Invalid or revoked link
        '401':
          description: An Authorization header with an invalid or expired token
        '409':
          description: >
            Misconfigured link (no leader account, no registration code, shared event
            without end time, or a team without a usable OTS group: code `team_has_no_group`,
            no account is created)
        '429':
          description: >
            Per-team/per-event device account cap or per-link creation throttle reached;
            for leader links more than 10 joins per minute on the link
        '500':
          description: Could not provision team access or generate the enrollment

  /events/teams/{id}:
    put:
      tags:
        - Events
      summary: Update a team (events_admin only) 🔒
      description: >
        All fields are optional. When otsGroupId is submitted, every open, unparked,
        unexpired device account of the team (in all events) whose granted group
        differs is moved to the team's group in OTS, best effort per account, and
        the organizer (HQ) devices of every event the team takes part in follow
        the new group too; submitting the same group again retries the failed ones.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                color:
                  type: string
                  nullable: true
                  description: A TAK team colour
                otsGroupId:
                  type: integer
                  nullable: true
                leaderUserId:
                  type: integer
                  nullable: true
      responses:
        '200':
          description: >
            The team; with otsGroupId in the body also reprovisioned (accounts moved)
            and reprovisionFailed (accounts that kept their old group)
        '400':
          description: Invalid input or unknown group/user
        '404':
          description: Team not found
        '409':
          description: Name already in use, or clearing the group while the team has open device accounts
    delete:
      tags:
        - Events
      summary: Delete a team and its links (events_admin only) 🔒
      description: >
        The team leaves every event it has links in; the organizer (HQ) devices of
        those events lose its group (best effort, counted).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: >
            Team deleted; reprovisioned/reprovisionFailed are included when organizer
            devices of an event were affected
        '404':
          description: Team not found
        '409':
          description: >
            The team has open sessions, or it is the organizer (HQ) team of an event
            (choose another organizer team for that event first)

  /events/{id}/links:
    get:
      tags:
        - Events
      summary: List the access links of an event (events_admin or events_readonly) 🔒
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The links
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventLink'
        '404':
          description: Event not found
    post:
      tags:
        - Events
      summary: Create an access link for a team and role (events_admin only) 🔒
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamId, role]
              properties:
                teamId:
                  type: integer
                role:
                  type: string
                  enum: [leader, player]
                onboardingCodeId:
                  type: integer
                  nullable: true
                direction:
                  type: string
                  enum: [BOTH, IN, OUT]
                  default: BOTH
      responses:
        '201':
          description: >
            Link created (includes the raw token and url once). When the event has an
            organizer (HQ) team, its devices are re-provisioned (a team new to the event
            is added to them) and reprovisioned/reprovisionFailed are included.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EventLink'
                  - $ref: '#/components/schemas/ReprovisionCounts'
        '400':
          description: Missing teamId/role, unknown team or onboarding code, or invalid direction
        '403':
          description: The onboarding code carries a role with permissions the caller does not hold
        '404':
          description: Event not found
        '409':
          description: A link for this team and role already exists

  /events/links/{id}:
    put:
      tags:
        - Events
      summary: Change the group direction of a link (events_admin only) 🔒
      description: >
        The new direction is saved and every open, unexpired device account of the
        link (also those moved to another team; parked ones are unaffected) whose
        granted groups differ is re-provisioned in OTS right away, best effort per
        account. Accounts that could not be updated keep their old groups and are
        counted in reprovisionFailed; saving the same direction again retries them
        (the periodic event job also retries them).
        OTS failures never fail the request. A leader link's direction applies to the
        leader's own devices. Devices pick up the change when they reconnect.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction]
              properties:
                direction:
                  type: string
                  enum: [BOTH, IN, OUT]
      responses:
        '200':
          description: Link updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EventLink'
                  - type: object
                    properties:
                      reprovisioned:
                        type: integer
                        description: Open accounts whose OTS groups were changed
                      reprovisionFailed:
                        type: integer
                        description: Open accounts that kept their old OTS groups
        '400':
          description: direction missing or not one of BOTH, IN, OUT
        '404':
          description: Link not found
    delete:
      tags:
        - Events
      summary: Delete a link (events_admin only) 🔒
      description: >
        Device accounts outlive their link; they keep the groups they were granted
        and are cleaned up as usual. Leader sessions of the link are marked revoked
        (the rows are kept for the audit trail). When it was the team's last link in an event
        with an organizer (HQ) team, the team leaves the event and the HQ devices
        lose its group (best effort, counted).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: >
            Link deleted; reprovisioned/reprovisionFailed are included when the event
            has an organizer team
        '404':
          description: Link not found
        '409':
          description: >
            The last link of the event's organizer (HQ) team; choose another organizer
            team first

  /events/links/{id}/url:
    get:
      tags:
        - Events
      summary: Re-show the join URL of an event link (events_admin only) 🔒
      description: >
        Re-derives the join URL for links whose token is derived from SECRET_KEY
        (field `retrievable` in the link list). Legacy links with a random token,
        or any link when SECRET_KEY is weak, return 409; regenerate the link first.
        Rotating SECRET_KEY makes derived links non-retrievable (printed QRs keep working).
        Only someone holding the permissions of the code's roles gets the URL of a link bound to that code.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The join URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
        '403':
          description: The link is bound to a code carrying a role with permissions the caller does not hold
        '404':
          description: Link not found
        '409':
          description: Link is not retrievable; regenerate it

  /events/{id}/accounts:
    get:
      tags:
        - Events
      summary: List the open device accounts of an event (events_admin or events_readonly) 🔒
      description: >
        Open `device` accounts plus legacy `shared` accounts (`legacy: true`, read-only).
        Each account has id (session id), otsUsername, team {id, name, color}, parked,
        createdAt, expiresAt, role, leaderName (display name of the leader session that
        created it, null if not created by a leader) and its euds [{callsign, uid, lastSeen}] from one OTS EUD
        listing (`eudsAvailable` is false when OTS could not be read). Never contains
        passwords or enrollment tokens.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Accounts of the event
        '404':
          description: Event not found

  /events/{id}/accounts/{sessionId}/move:
    post:
      tags:
        - Events
      summary: Move a device account to another team, or park it (events_admin only) 🔒
      description: >
        Body `{teamId: int|null}`. A team id puts the account IN+OUT in that team's OTS
        group; null parks it (OUT member of the event's `evt<id>_parked` group, which nobody
        writes into, plus IN member of `evt<id>_parked_in`, which nobody receives from; no
        team colour). Parked devices see no one and nobody sees them. The new groups are
        always joined before the old ones are left, so the device always keeps an IN and an
        OUT membership; if OTS fails the calls made (including the failing one) are reverted
        and nothing changes locally (502). Moving to the current team (or parking a parked
        account) is a 200 no-op. Sending switches to the new team immediately; receiving
        from the new team starts after the device reconnects (restart ATAK or toggle its
        connection). Moving into the event's organizer (HQ) team adds the organizer
        memberships on the other teams' groups; moving out (or parking) removes them.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The updated account
        '400':
          description: Invalid or unknown teamId, or the team has no usable OTS group
        '404':
          description: Account not found in this event
        '409':
          description: Account is closed, expired or a legacy shared account
        '502':
          description: OpenTAK Server group update failed; nothing was changed

  /events/{id}/accounts/{sessionId}/close:
    post:
      tags:
        - Events
      summary: Close a device account now (events_admin only) 🔒
      description: >
        Applies the event's accountCleanup policy (deactivate or delete), removes the
        account from its OTS groups (best-effort) and closes the session with reason
        `closed by admin`. A device that is connected stays connected until it
        reconnects. 502 when the OTS account could not be deactivated; it stays open.
        If the account was deactivated/deleted but colour or group cleanup failed, the
        session also stays open (the close job retries it) and the 502 body has
        `accountDisabled: true, cleanupPending: true`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Account closed
        '404':
          description: Account not found in this event
        '409':
          description: Account is already closed or a legacy shared account
        '502':
          description: OpenTAK Server cleanup failed; the account is still open

  /events/links/{id}/close-sessions:
    post:
      tags:
        - Events
      summary: Close all open device accounts created through a link (events_admin only) 🔒
      description: >
        Same cleanup as closing a single account, for at most 25 accounts per call.
        Returns `{closed, failed, remaining}`; `remaining` is the number of this link's
        accounts still open, so call again while it is above 0. `failed` also counts
        accounts that are disabled but whose cleanup is pending (`cleanupPending`).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Batch processed without failures (check `remaining`)
        '404':
          description: Link not found
        '502':
          description: Some accounts could not be closed and are still open

  /events/{id}/team-leaders:
    get:
      tags:
        - Events
      summary: List the personal leaders of an event (events_admin or events_readonly) 🔒
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Designations, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  teamLeaders:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventTeamLeader'
        '404':
          description: Event not found
    post:
      tags:
        - Events
      summary: Designate a portal user as leader of a team for this event (events_admin only) 🔒
      description: >
        The user keeps their normal login and rights and gets the team's leader page
        (`/events/my-team*`) while the event is open. Also creates the user's leader
        session row (kind account) that the devices they enrol record.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamId, userId]
              properties:
                teamId:
                  type: integer
                userId:
                  type: integer
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTeamLeader'
        '400':
          description: >
            teamId/userId missing or not integers, the team has no link in this event,
            unknown or expired user, or the user is the shared leader account of a team
        '404':
          description: Event not found
        '409':
          description: The user is already a leader of this team in this event

  /events/{id}/team-leader-candidates:
    get:
      tags:
        - Events
      summary: Search users that can be designated as team leader (events_admin only) 🔒
      description: >
        Matches username or callsign, at most 20 results, ordered by username. Leaves
        out expired users, shared leader accounts of any team and, with teamId, users
        already designated for that team in this event. Returns only id, username and
        callsign.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: search
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: teamId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Candidates
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        username: {type: string}
                        callsign: {type: string, nullable: true}
        '400':
          description: search shorter than 2 characters
        '404':
          description: Event not found

  /events/{id}/team-leaders/{designationId}:
    delete:
      tags:
        - Events
      summary: Remove a personal leader (events_admin only) 🔒
      description: >
        Ends the user's access to the team page at once and marks their leader session
        row revoked. The devices they enrolled stay open.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: designationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Removed
        '404':
          description: Not found in this event

  /events/{id}/leader-sessions:
    get:
      tags:
        - Events
      summary: List the leader sessions of an event (events_admin or events_readonly) 🔒
      description: >
        Everyone who joined through a leader link of this event, and the personal leaders
        (kind account), oldest first, including revoked sessions. Not available to leader
        sessions (403).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Leader sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  leaderSessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventLeaderSession'
        '404':
          description: Event not found

  /events/{id}/leader-sessions/{sessionId}/revoke:
    post:
      tags:
        - Events
      summary: Revoke one leader session (events_admin only) 🔒
      description: >
        Ends that person's leader access at once (401 on `/auth/refresh`, `/auth/me`,
        `/auth/permissions`, 403 on `/events/my-team*`) without regenerating the link, so
        the other leaders of the team keep working. The device accounts the leader created
        stay open; close them separately. Regenerating the leader link still ends all of
        its sessions. For a personal leader (kind account) the designation is removed.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The revoked leader session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventLeaderSession'
        '404':
          description: Leader session not found in this event
        '409':
          description: Leader session is already revoked

  /events/my-team:
    get:
      tags:
        - Events
      summary: Own-team view for an event leader session or a personal leader 🔒
      description: >
        For a bounded leader session (JWT issued by joining a leader link) event and
        team are taken from the token, never from the request. For a normal user
        session it needs a valid personal leader designation (see `/events/{id}/team-leaders`);
        eventId/teamId pick one (400 code `leader_team_required` when several match,
        403 when none). The same applies to every `/events/my-team*` endpoint. Returns 403
        for any other token, when events are disabled, when the event is not open, when
        the user is no longer the team's leader, or when the leader link the session
        came from was regenerated or deleted, or the leader session was revoked (or the
        token has no `event_leader_session` claim). `playerLink` is null when the link is missing
        (an admin has to create it) or not retrievable (an admin has to regenerate it); see
        `reason`: `missing` or `notRetrievable`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LeaderEventId'
        - $ref: '#/components/parameters/LeaderTeamId'
      responses:
        '200':
          description: Own-team data
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      validUntil:
                        type: string
                        format: date-time
                        nullable: true
                  team:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      color:
                        type: string
                        nullable: true
                  mode:
                    type: string
                    enum: [shared, individual]
                  expiresAt:
                    type: string
                    format: date-time
                    nullable: true
                  playerLink:
                    type: object
                    nullable: true
                    properties:
                      url:
                        type: string
                  reason:
                    type: string
                    enum: [missing, notRetrievable]
                    description: Present only when playerLink is null
                  atakAvailable:
                    type: boolean
                  leaderName:
                    type: string
                    description: displayName of the current leader session (a personal leader's callsign or username)
        '400':
          description: Personal leader with several valid designations and no unique eventId/teamId
        '403':
          description: Not a valid leader session or personal leader for an open event

  /events/my-team/enrollment:
    post:
      tags:
        - Events
      summary: Create a new device account and its ATAK enrollment QR in the leader's team (leader session) 🔒
      description: >
        Shared mode only. Every call creates a NEW OTS account for one device in the
        leader's team (evt<eventId>_<random>) and a single-use enrollment string valid
        15 minutes (or until the event ends). Limited to 100 open device accounts per
        team (500 per event) and throttled to 10 attempts per minute for leader presses
        (separate from the player link throttle); both return 429. The response
        never contains a password (the qrString is a bearer enrollment token).
        With forLeader true the device is the leader's own (session role `leader`):
        it joins through the team's leader link and takes that link's direction (a
        personal leader whose team has no leader link in the event joins through the
        player link and always gets BOTH); otherwise it is a player device of the team's
        player link. Either way the
        device records the leader session that created it (leaderName in the account lists).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LeaderEventId'
        - $ref: '#/components/parameters/LeaderTeamId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                forLeader:
                  type: boolean
                  default: false
      responses:
        '200':
          description: ATAK enrollment
          content:
            application/json:
              schema:
                type: object
                properties:
                  atak:
                    type: object
                    properties:
                      qrString:
                        type: string
                        nullable: true
                      expiresAt:
                        type: integer
                        description: Unix epoch seconds
        '403':
          description: Not a valid leader session for an open event
        '409':
          description: >
            Event is in individual mode or has no end time, or the team has no usable
            OTS group (code `team_has_no_group`)
        '429':
          description: Device account cap or creation throttle reached
        '500':
          description: Could not provision or generate the enrollment

  /events/my-team/accounts:
    get:
      tags:
        - Events
      summary: List all open device accounts of the leader's event (leader session) 🔒
      description: >
        Every open account of the event: all teams, parked, and legacy shared
        sessions (read-only, legacy=true). Event and team come from the leader
        token only. Never contains passwords or tokens. EUDs (callsign, uid) come
        from one OpenTAK Server listing; eudsAvailable is false when it could not
        be read. inMyTeam is true for active accounts of the leader's own team.
        For active accounts of other teams only the EUD callsign is returned
        (no uid, no lastSeen). teams lists the event's teams that can be moved to
        (never the organizer (HQ) team).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LeaderEventId'
        - $ref: '#/components/parameters/LeaderTeamId'
      responses:
        '200':
          description: Accounts of the event
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        otsUsername: {type: string}
                        legacy: {type: boolean}
                        team:
                          type: object
                          nullable: true
                          properties:
                            id: {type: integer}
                            name: {type: string}
                            color: {type: string, nullable: true}
                        parked: {type: boolean}
                        inMyTeam: {type: boolean}
                        role: {type: string, nullable: true}
                        leaderName:
                          type: string
                          nullable: true
                          description: Leader session that created it; null for every account not in the own team (other teams and parked)
                        createdAt: {type: string, nullable: true}
                        expiresAt: {type: string, nullable: true}
                        euds:
                          type: array
                          items:
                            type: object
                            properties:
                              callsign: {type: string, nullable: true}
                              uid: {type: string, nullable: true}
                              lastSeen: {type: string, nullable: true}
                  eudsAvailable: {type: boolean}
                  myTeamId: {type: integer}
                  teams:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        name: {type: string}
                        color: {type: string, nullable: true}
        '403':
          description: Not a valid leader session for an open event
        '401':
          description: Missing or invalid token

  /events/my-team/accounts/{sessionId}/move:
    post:
      tags:
        - Events
      summary: Park, move or pull a device account (leader session) 🔒
      description: >
        A leader may take an account of the own team out (teamId null parks it, or
        a teamId of another team of the event moves it) and may add a PARKED
        account to the own team (teamId = own team). Accounts active in another
        team cannot be pulled; that team must park or move them first. Anything
        else is 403 (other team to own team, other to other, other to park,
        parked to another team, parked to park). Moving into the event's organizer
        (HQ) team is 400: only an admin can do that. Rules use the account's current state and the team in the leader
        token. Groups are added before removed and reverted on failure. Sending
        switches immediately; receiving after the device reconnects.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/LeaderEventId'
        - $ref: '#/components/parameters/LeaderTeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamId]
              properties:
                teamId:
                  type: integer
                  nullable: true
      responses:
        '200':
          description: Moved (or already in the requested state)
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    type: object
                    properties:
                      id: {type: integer}
                      otsUsername: {type: string}
                      legacy: {type: boolean}
                      team:
                        type: object
                        nullable: true
                        properties:
                          id: {type: integer}
                          name: {type: string}
                          color: {type: string, nullable: true}
                      parked: {type: boolean}
                      createdAt: {type: string, nullable: true}
                      expiresAt: {type: string, nullable: true}
        '400':
          description: Invalid or unknown teamId, or the event's organizer (HQ) team
        '403':
          description: Not a valid leader session, or the move is not allowed for a leader
        '404':
          description: Account not found in this event
        '409':
          description: Legacy shared account, closed account, or expired account
        '502':
          description: OpenTAK Server group update failed; nothing was changed
        '500':
          description: Could not save the change

  /users:
    get:
      tags:
        - Users
      summary: List all users (admin) 🔒
      description: Get paginated list of all users
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
        - name: search
          in: query
          description: Search username, email, or callsign
          schema:
            type: string
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  total:
                    type: integer
                  page:
                    type: integer
                  per_page:
                    type: integer
        '403':
          description: Administrator role required

    post:
      tags:
        - Users
      summary: Create user (admin) 🔒
      description: Create a new user account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
                - email
                - firstName
                - lastName
                - callsign
              properties:
                username:
                  type: string
                  pattern: '^[a-z0-9]{3,32}$'
                  minLength: 3
                  maxLength: 32
                  description: Lowercase letters and numbers only. Input is lowercased and trimmed before validation.
                password:
                  type: string
                  minLength: 8
                  description: 'Printable ASCII only. Not allowed: `& ^ $ < > : @` or a space at the start or end.'
                email:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                callsign:
                  type: string
                roleIds:
                  type: array
                  items:
                    type: integer
                expiryDate:
                  type: string
                  format: date-time
      responses:
        '201':
          description: User created successfully
        '400':
          description: Missing field, invalid username, groups, groupIds or expiryDate (nothing reached OTS), OTS refused the new user (for example because the username already exists there), or the database refused it. If storing it locally fails the new OTS account is deleted again; `otsMayDiffer` is true if that failed.
        '403':
          description: User admin role required, or roleIds has a role with permissions the caller does not hold (a privileged role needs an administrator)
        '409':
          description: Username already exists
        '502':
          description: >
            OTS did not accept a group membership of the new user: the memberships already added and the new
            OTS account are removed again, and the user is not created (`failedGroups` is set). Or OTS could not
            be reached or gave an unexpected answer while creating the account: the user is not created locally,
            but the OTS account may exist and is not deleted automatically, as it may belong to someone else
            (`otsMayDiffer` is true, no `failedGroups`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  failedGroups:
                    type: array
                    items:
                      type: string
                    description: The groups OTS did not accept
                  otsMayDiffer:
                    type: boolean
                    description: True if the OTS account may exist without a portal user; check it in OTS

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Get detailed user information (own profile, or administrator, user_admin or user_readonly; checked against database roles, not token claims)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Permission denied
        '404':
          description: User not found

    put:
      tags:
        - Users
      summary: Update user
      description: >
        Update user information. Roles are checked in the database, not in the token. On your own
        profile you can change email, firstName, lastName, callsign and language; administrator and
        user_admin can also change roleIds, expiryDate, groups, groupIds and password. A non-administrator
        cannot change another user holding a privileged role (administrator/admin, in any case), and cannot
        add or remove a privileged role; roleIds is the full list, unchanged roles are not a change.
        Likewise anyone: another user only if the caller holds all that user's permissions, and adding or
        removing a role only if the caller holds all its permissions.
        When the privileged state of the user changes, the OTS role is set first (`administrator` or
        `user`, replacing all OTS roles) on the account found case-insensitively, and read back; if OTS
        refuses or the role did not change, nothing is changed. If the outcome is unknown (a lost OTS
        response or failed read-back) the portal is not changed and the OTS role is put back. Taking the
        role from an account OTS does not have succeeds; granting it refuses. A user without a password
        has no OTS account yet: the OTS call is skipped and set-password creates it with the right role. groups and
        groupIds take different integer ids. The account named in
        OTS_USERNAME cannot get a password, an expiry date or lose its privileged role; the last
        administrator cannot lose the role.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                callsign:
                  type: string
                roleIds:
                  type: array
                  items:
                    type: integer
                  description: Administrator or user_admin only
                expiryDate:
                  type: string
                  format: date-time
                  description: Administrator or user_admin only
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: Administrator or user_admin only
      responses:
        '200':
          description: User updated successfully
        '400':
          description: Invalid value, or OTS refused the role change (for example under LDAP, or no such OTS account); nothing was changed. Also a failure after an OTS change (the password reset or storing the update); the local update is rolled back, the groups and role are put back in OTS, `passwordChanged` tells whether the password was already changed, and `otsMayDiffer` is true if putting OTS back failed.
        '403':
          description: Permission denied, privileged role or target without the administrator role, a role or target with permissions the caller does not hold (missingPermissions lists them), or a change the service account does not allow
        '404':
          description: User not found
        '409':
          description: The last administrator cannot lose the administrator role
        '502':
          description: >
            The role could not be changed in OTS, or the change did not show when read back; or OTS did not
            accept a group membership (then `failedGroups` is set). The portal was not changed, group memberships
            already changed and the role are put back in OTS, and the password is not changed (it is reset last).
            The error says nothing was changed if that is certain; otherwise OTS and the portal may differ
            (`otsMayDiffer`) and it says to check the account in OTS.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  failedGroups:
                    type: array
                    items:
                      type: string
                    description: The groups OTS did not accept (only for a failed group change)
                  otsMayDiffer:
                    type: boolean
                    description: True if the role change could not be confirmed, or putting the groups or role back in OTS failed; check the account in OTS
                  passwordChanged:
                    type: boolean
                    description: Always false; the password is only reset after the groups were changed

    delete:
      tags:
        - Users
      summary: Delete user (administrator or user_admin) 🔒
      description: Deletes the user from OTS and the local database. A non-administrator cannot delete a user holding a privileged role; the account named in OTS_USERNAME and the last administrator cannot be deleted. If OTS answers 400 and has no such account, the user is deleted locally only; any other OTS failure returns 502. API keys the user created are deactivated and lose their creator; announcements stay, without a creator.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User deleted successfully
        '403':
          description: User admin role required, target holds a privileged role and caller is no administrator, target holds permissions the caller does not hold, or target is the service account
        '404':
          description: User not found
        '409':
          description: Target is the last administrator, or other records still reference the user; nothing was deleted locally or in OTS
        '502':
          description: OTS could not be reached, refused or failed; the user was kept in both stores
        '500':
          description: Unexpected local failure; the transaction was rolled back

  /roles:
    get:
      tags:
        - Roles
      summary: List all roles (any permission) 🔒
      description: Anyone holding any permission can read this, because admin pages use it as a picker. `permissions`, `userCount` and `codeCount` are only included for holders of roles.view.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: Page size; omit to return everything
          schema:
            type: integer
        - name: search
          in: query
          description: Search name, display name or description
          schema:
            type: string
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
                  total:
                    type: integer
                  page:
                    type: integer
                  per_page:
                    type: integer
                    nullable: true
        '403':
          description: No admin role

    post:
      tags:
        - Roles
      summary: Create role (admin) 🔒
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Role created successfully
        '400':
          description: Missing name, a reserved name (administrator, admin, event_leader, user or any built-in admin role, ignoring case and surrounding whitespace), or the description `Auto-created from OTS`, which is reserved for roles created from OpenTAK Server
        '403':
          description: Administrator role required
        '409':
          description: Role already exists

  /roles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags:
        - Roles
      summary: Get role by ID (roles.view) 🔒
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The fields of the Role schema with its users, TAK profiles and Meshtastic configs
        '403':
          description: Role admin or readonly access required
        '404':
          description: Role not found
    put:
      tags:
        - Roles
      summary: Update role (administrator or role_admin) 🔒
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Role updated
        '400':
          description: Rename to a reserved name, or a change to the reserved description `Auto-created from OTS` (see POST /roles)
        '403':
          description: Role admin access required, a protected role, or a role holding permissions the caller does not hold (missingPermissions lists them). Other privileged rows (such as admin) are protected for non-administrators.
        '404':
          description: Role not found
        '409':
          description: Role name already exists
    delete:
      tags:
        - Roles
      summary: Delete role (administrator or role_admin) 🔒
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Role deleted
        '403':
          description: Role admin access required, a protected role, or a role holding permissions the caller does not hold (missingPermissions lists them). Other privileged rows (such as admin) are protected for non-administrators.
        '404':
          description: Role not found

  /roles/permission-catalog:
    get:
      tags:
        - Roles
      summary: What a role can hold, for the role editor (roles.view) 🔒
      description: Keys only, the labels are in the frontend's translations. Each function is one row in the editor; `kind` says which of its keys it has (`viewEdit`, `view`, `edit` or one `action`).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Modules with their functions and keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  modules:
                    type: array
                    items:
                      type: object
                      properties:
                        module:
                          type: string
                        enabled:
                          type: boolean
                          description: False if the module is switched off in the settings
                        functions:
                          type: array
                          items:
                            type: object
                            properties:
                              function:
                                type: string
                              kind:
                                type: string
                                enum: [viewEdit, view, edit, action]
                              permissions:
                                type: array
                                items:
                                  $ref: '#/components/schemas/PermissionCatalogKey'
        '403':
          description: Role admin or readonly access required

  /roles/{id}/permissions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags:
        - Roles
      summary: Replace the permissions of a custom role (roles.permissions.edit) 🔒
      description: Full list. The caller must hold every key in it, and every key the role holds now, so a role above their level stays out of reach.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePermissionsRequest'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  permissions:
                    type: array
                    items:
                      type: string
                  impact:
                    $ref: '#/components/schemas/RolePermissionImpact'
        '400':
          description: Not a list of keys, unknown keys or administrator-only keys (permissions lists them)
        '403':
          description: Role admin access required, not a custom role, permissions the caller does not hold, or permissions of other roles that would start to count for users or codes holding this role and that the caller does not hold (missingPermissions lists them)
        '404':
          description: Role not found
        '409':
          description: Changed by someone else at the same time

  /roles/{id}/permissions/preview:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      tags:
        - Roles
      summary: What saving this list would change, without saving (roles.permissions.edit) 🔒
      description: Refuses exactly what PUT /roles/{id}/permissions would refuse.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePermissionsRequest'
      responses:
        '200':
          description: The list as it would be stored and its impact
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items:
                      type: string
                  impact:
                    $ref: '#/components/schemas/RolePermissionImpact'
        '400':
          description: Not a list of keys, unknown keys or administrator-only keys
        '403':
          description: Role admin access required, not a custom role, or permissions the caller does not hold
        '404':
          description: Role not found

  /roles/{id}/duplicate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      tags:
        - Roles
      summary: New custom role with the permissions of this one (roles.edit and roles.permissions.edit) 🔒
      description: Also from a built-in role, without its administrator-only keys. Holders and audiences (TAK profiles, Meshtastic, announcements) are not copied. Refused if the caller does not hold every key to copy.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                displayName:
                  type: string
                description:
                  type: string
                  description: Defaults to the description of the source
      responses:
        '201':
          description: The new role with its permissions
        '400':
          description: Missing name, a reserved name, or the reserved description `Auto-created from OTS`
        '403':
          description: Role admin access required, or keys the caller does not hold (missingPermissions lists them)
        '404':
          description: Role not found
        '409':
          description: Role already exists

  /onboarding-codes:
    get:
      tags:
        - Onboarding Codes
      summary: List onboarding codes (admin) 🔒
      description: Codes carrying a privileged role are listed for administrators only. A code carrying a role with permissions the caller does not hold is listed read-only with `onboardingCode` null and `aboveLevel` true, and a search does not match its value. The code value is a registration ticket.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: Page size; omit to return everything
          schema:
            type: integer
        - name: search
          in: query
          description: Search name, description or code
          schema:
            type: string
      responses:
        '200':
          description: List of onboarding codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  codes:
                    type: array
                    items:
                      $ref: '#/components/schemas/OnboardingCode'
                  total:
                    type: integer
                  page:
                    type: integer
                  per_page:
                    type: integer
                    nullable: true

    post:
      tags:
        - Onboarding Codes
      summary: Create onboarding code (administrator or onboarding_admin) 🔒
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Code created
        '400':
          description: Missing or invalid values
        '403':
          description: Onboarding admin access required, or a new role in roleIds or a new or replaced approverRoleId holds permissions the caller does not hold (a privileged role in roleIds needs an administrator)
        '409':
          description: Onboarding code already exists

  /onboarding-codes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags:
        - Onboarding Codes
      summary: Get onboarding code (administrator, onboarding_admin or onboarding_readonly) 🔒
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The code; `onboardingCode` is null and `aboveLevel` true when it carries a role with permissions the caller does not hold
        '403':
          description: Onboarding admin or readonly access required
        '404':
          description: Not found, also when the code carries a privileged role and the caller is not an administrator
    put:
      tags:
        - Onboarding Codes
      summary: Update onboarding code (administrator or onboarding_admin) 🔒
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Code updated
        '400':
          description: Invalid values
        '403':
          description: Onboarding admin access required, the code carries a role with permissions the caller does not hold, a new role in roleIds holds permissions the caller does not hold, or a privileged role is set or replaced in roleIds or approverRoleId by someone who is not an administrator
        '404':
          description: Not found, also when the code carries a privileged role and the caller is not an administrator
    delete:
      tags:
        - Onboarding Codes
      summary: Delete onboarding code (administrator or onboarding_admin) 🔒
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Code deleted
        '403':
          description: Onboarding admin access required, or the code carries a role with permissions the caller does not hold
        '404':
          description: Not found, also when the code carries a privileged role and the caller is not an administrator

  /pending-registrations:
    post:
      tags:
        - Onboarding Codes
      summary: Create a pending registration (administrator or registration_admin) 🔒
      description: In GET responses for pending registrations, the code value and verification token are null when the code carries a role with permissions the caller does not hold.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Registration created, or user created when the code auto-approves
        '400':
          description: Missing or invalid values
        '403':
          description: Registration admin access required, or the code carries a role with permissions the caller does not hold
        '409':
          description: Username or email already in use

  /pending-registrations/{id}:
    put:
      tags:
        - Onboarding Codes
      summary: Update a pending registration (administrator or registration_admin) 🔒
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Registration updated and a verification email sent
        '403':
          description: Registration admin access required, or the current or new code carries a role with permissions the caller does not hold
        '404':
          description: Pending registration not found

  /pending-registrations/{id}/approve:
    post:
      tags:
        - Onboarding Codes
      summary: Approve a pending registration (administrator or registration_admin) 🔒
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: >
            User created. If OTS refused some of the code's groups the registration still goes through,
            the user is not in those groups (no local membership either) and `failedGroups` lists them.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    type: object
                  failedGroups:
                    type: array
                    items:
                      type: string
                    description: Only present when OTS refused one or more groups of the onboarding code
        '403':
          description: Registration admin access required, manual approval disabled, or the code carries a role with permissions the caller does not hold
        '404':
          description: Pending registration not found

  /approvals:
    get:
      tags:
        - Onboarding Codes
      summary: Registrations waiting for the caller's approval 🔒
      description: Each item has `canApprove`, false when the code carries a role with permissions the caller does not hold (approving would then be refused).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The pending approvals of the codes whose approver role the caller holds

  /approvals/{id}/approve:
    post:
      tags:
        - Onboarding Codes
      summary: Approve a registration as a member of the approver role 🔒
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: >
            User created. If OTS refused some of the code's groups the registration still goes through,
            the user is not in those groups (no local membership either) and `failedGroups` lists them.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    type: object
                  failedGroups:
                    type: array
                    items:
                      type: string
                    description: Only present when OTS refused one or more groups of the onboarding code
        '403':
          description: Not in the approver role, or the code carries a role with permissions the caller does not hold
        '404':
          description: Pending registration not found

