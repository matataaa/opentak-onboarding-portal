                  kiosk_language:
                    type: string
                    enum: ['', en, nl, de]
                    description: Fixed UI language for the kiosk screen (/kiosk); empty = follow the browser
                    example: ''
                  login_header_bar_enabled:
                    type: boolean
                  login_hero_texts:
                    type: object
                    description: Hero texts per language for the split layout ({} when unset or malformed)
                    additionalProperties:
                      type: object
                      properties:
                        eyebrow:
                          type: string
                        headline:
                          type: string
                        description:
                          type: string
                        footer:
                          type: string
                    example:
                      en:
                        headline: Welcome to our TAK server

  /admin/settings:
    get:
      tags:
        - Settings
      summary: Get all system settings
      description: Retrieve all system settings grouped by category (settings.view). Each setting has `editable`, whether the current user may change it.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: System settings grouped by category
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/Setting'
              example:
                notifications:
                  - id: 1
                    key: "notify_admin_pending_registration"
                    value: "true"
                    category: "notifications"
                    description: "Send notification to admin when a new pending registration is created"
                    editable: true
                  - id: 2
                    key: "notify_admin_new_registration"
                    value: "true"
                    category: "notifications"
                    description: "Send notification to admin when a new user registration is approved"
                    editable: true
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to retrieve settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/settings/{setting_id}:
    put:
      tags:
        - Settings
      summary: Update a system setting by ID
      description: Update the value of a system setting using its ID (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: setting_id
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the setting to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - value
              properties:
                value:
                  type: string
                  description: The new value for the setting (can be "true"/"false" for booleans)
              example:
                value: "false"
      responses:
        '200':
          description: Setting updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  setting:
                    $ref: '#/components/schemas/Setting'
        '400':
          description: Value is required, or invalid value for this setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Setting not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to update setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/settings/key/{key}:
    put:
      tags:
        - Settings
      summary: Update a system setting by key
      description: Update the value of a system setting using its key name (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: The key name of the setting to update (e.g., "notify_admin_pending_registration")
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - value
              properties:
                value:
                  type: string
                  description: The new value for the setting (can be "true"/"false" for booleans)
              example:
                value: "true"
      responses:
        '200':
          description: Setting updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  setting:
                    $ref: '#/components/schemas/Setting'
        '400':
          description: Value is required, or invalid value for this setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Setting not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to update setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/login-background:
    post:
      tags:
        - Settings
      summary: Upload the login page background image
      description: Requires administrator or settings_admin. Replaces (and deletes) any previous background.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - background
              properties:
                background:
                  type: string
                  format: binary
                  description: PNG, JPG/JPEG or WebP image, max 5MB
      responses:
        '200':
          description: Background uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  login_background_path:
                    type: string
                    example: /api/v1/uploads/login_bg_1a2b3c4d.jpg
        '400':
          description: No file, invalid file type or file too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Settings admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to upload login background
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Settings
      summary: Remove the login page background image
      description: Requires administrator or settings_admin. Deletes the file and clears login_background_path.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Login background removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: Settings admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to delete login background
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

