              schema:
                type: object
                properties:
                  message:
                    type: string
                  setting:
                    $ref: '#/components/schemas/Setting'
        '400':
          description: Value is required, or invalid value for this setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Setting not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to update setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/settings/key/{key}:
    put:
      tags:
        - Settings
      summary: Update a system setting by key
      description: Update the value of a system setting using its key name (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: The key name of the setting to update (e.g., "notify_admin_pending_registration")
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - value
              properties:
                value:
                  type: string
                  description: The new value for the setting (can be "true"/"false" for booleans)
              example:
                value: "true"
      responses:
        '200':
          description: Setting updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  setting:
                    $ref: '#/components/schemas/Setting'
        '400':
          description: Value is required, or invalid value for this setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Setting not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to update setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/login-background:
    post:
      tags:
        - Settings
      summary: Upload the login page background image
      description: Requires administrator or settings_admin. Replaces (and deletes) any previous background.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - background
              properties:
                background:
                  type: string
                  format: binary
                  description: PNG, JPG/JPEG or WebP image, max 5MB
      responses:
        '200':
          description: Background uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  login_background_path:
                    type: string
                    example: /api/v1/uploads/login_bg_1a2b3c4d.jpg
        '400':
          description: No file, invalid file type or file too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Settings admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to upload login background
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Settings
      summary: Remove the login page background image
      description: Requires administrator or settings_admin. Deletes the file and clears login_background_path.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Login background removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: Settings admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to delete login background
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/announcements:
    get:
      tags:
        - Announcements
      summary: List all announcements
      description: Requires administrator, announcement_admin or announcement_readonly. Includes email delivery state.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Announcements
          content:
            application/json:
              schema:
                type: object
                properties:
                  announcements:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnnouncementSummary'
        '403':
          description: Announcement admin or readonly access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/announcements/{announcement_id}:
    get:
      tags:
        - Announcements
      summary: Get announcement details
      description: Requires administrator, announcement_admin or announcement_readonly. Includes email delivery state with pending and dropped recipients resolved to users.
      security:
        - bearerAuth: []
      parameters:
        - name: announcement_id
