openapi: 3.0.3
info:
  title: OpenTAK Onboarding Portal API
  description: |
    RESTful API for the OpenTAK Onboarding Portal.

    ## Authentication
    Most endpoints require JWT authentication. Use the `/auth/login` endpoint to obtain access and refresh tokens.

    Include the access token in the Authorization header:
    ```
    Authorization: Bearer <access_token>
    ```

    Event leader sessions (tokens issued by `/events/join/{token}` for a leader link) are
    deny-by-default: they may only call the `/events/my-team*` endpoints, `/auth/refresh`,
    `/auth/me` and `/auth/permissions`. Every other endpoint returns 403.

    ## Admin Endpoints
    Endpoints marked with 🔒 require the 'administrator' role.
  version: 1.0.0
  contact:
    name: OpenTAK Onboarding Portal

servers:
  - url: http://localhost:5000/api/v1
    description: Development server
  - url: /api/v1
    description: Production server (relative)

tags:
  - name: Authentication
    description: User authentication and authorization
  - name: Users
    description: User management (admin only)
  - name: Roles
    description: Role management
  - name: Onboarding Codes
    description: Onboarding code management
  - name: TAK Profiles
    description: TAK profile management and downloads
  - name: Meshtastic
    description: Meshtastic radio configuration management
  - name: OTS Groups
    description: OTS group (channel) management
  - name: Radios
    description: Radio device inventory management
  - name: Packages
    description: ATAK package management
  - name: Settings
    description: System settings management (admin only)
  - name: Announcements
    description: Announcement management (admin or announcement_admin / announcement_readonly)
  - name: Events
    description: Events module (events_admin / events_readonly)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /auth/login

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        callsign:
          type: string
        roles:
          type: array
          items:
            type: string
        expiryDate:
          type: string
          format: date-time
          nullable: true
        onboardedBy:
          type: string
          nullable: true

    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string

    OnboardingCode:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        onboardingCode:
          type: string
        uses:
          type: integer
        maxUses:
          type: integer
          nullable: true
        validFrom:
          type: string
          format: date-time
          nullable: true
        expiryDate:
          type: string
          format: date-time
          nullable: true
        userExpiryDate:
          type: string
          format: date-time
          nullable: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    TakProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        isPublic:
          type: boolean

    Meshtastic:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        url:
          type: string
        isPublic:
          type: boolean
        defaultRadioConfig:
          type: boolean
        showOnHomepage:
          type: boolean

    Radio:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        platform:
          type: string
        radioType:
          type: string
          enum: [meshtastic, other]
        description:
          type: string
        mac:
          type: string

    Package:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        platform:
          type: string
        typePackage:
          type: string
        description:
          type: string
        version:
          type: string

    Setting:
      type: object
      properties:
        id:
          type: integer
        key:
          type: string
          description: Unique identifier for the setting
        value:
          type: string
          description: The value of the setting (string representation)
        category:
          type: string
          description: Category grouping (e.g., "notifications", "email", "security")
        description:
          type: string
          description: Human-readable description of what this setting does

    AnnouncementEmailStatus:
      type: object
      description: |
        Email delivery state. `status` of the announcement itself only says whether it is
        published in-app; mail is delivered separately by a background job with retries.
      properties:
        emailStatus:
          type: string
          nullable: true
          enum: [pending, sent, failed, skipped]
          description: null when sendEmail is false
        emailAttempts:
          type: integer
          description: Number of failed delivery runs so far (terminal "failed" after 6)
        emailLastError:
          type: string
          nullable: true
          description: Hidden (null) for the announcement_readonly role
        emailNextAttemptAt:
          type: string
          format: date-time
          nullable: true
        emailPendingCount:
          type: integer
          description: Recipients still owed a mail
        emailFailureCount:
          type: integer
          description: Recipients dropped because their address was refused

    AnnouncementEmailRecipient:
      type: object
      properties:
        userId:
          type: integer
        username:
          type: string
          nullable: true
          description: null when the user no longer exists
        email:
          type: string
          nullable: true
          description: Hidden (null) for the announcement_readonly role
        error:
          type: string
          nullable: true
          description: Only for dropped (refused) recipients; hidden (null) for the announcement_readonly role

    AnnouncementSummary:
      allOf:
        - $ref: '#/components/schemas/AnnouncementEmailStatus'
        - type: object
          properties:
            id:
              type: integer
            title:
              type: string
            content:
              type: string
            targetType:
              type: string
              enum: [all, roles, users]
            status:
              type: string
              enum: [draft, scheduled, sent]
            sendEmail:
              type: boolean
            scheduledAt:
              type: string
              format: date-time
              nullable: true
            sentAt:
              type: string
              format: date-time
              nullable: true
            createdAt:
              type: string
              format: date-time
            readCount:
              type: integer
            totalTargeted:
              type: integer

    AnnouncementDetail:
      allOf:
        - $ref: '#/components/schemas/AnnouncementEmailStatus'
        - type: object
          properties:
            id:
              type: integer
            title:
              type: string
            content:
              type: string
            targetType:
              type: string
              enum: [all, roles, users]
            status:
              type: string
              enum: [draft, scheduled, sent]
            sendEmail:
              type: boolean
            scheduledAt:
              type: string
              format: date-time
              nullable: true
            sentAt:
              type: string
              format: date-time
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            createdBy:
              type: object
              nullable: true
              properties:
                id:
                  type: integer
                username:
                  type: string
            targetRoles:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  displayName:
                    type: string
            targetUsers:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  username:
                    type: string
            stats:
              type: object
              properties:
                totalReads:
                  type: integer
                emailOpens:
                  type: integer
                totalTargeted:
                  type: integer
            reads:
              type: array
              items:
                type: object
                properties:
                  userId:
                    type: integer
                  username:
                    type: string
                  readAt:
                    type: string
                    format: date-time
                  emailOpened:
                    type: boolean
                  emailOpenedAt:
                    type: string
                    format: date-time
                    nullable: true
            emailPending:
              type: array
              items:
                $ref: '#/components/schemas/AnnouncementEmailRecipient'
            emailFailures:
              type: array
              description: Recipients dropped because their address was refused
              items:
                $ref: '#/components/schemas/AnnouncementEmailRecipient'

paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate with username and password to receive JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  format: password
                  example: password
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: JWT access token (12 hour expiry)
                  refresh_token:
                    type: string
                    description: JWT refresh token (30 day expiry)
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Get a new access token using a refresh token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
        '401':
          description: Invalid or expired refresh token

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Get the authenticated user's profile information
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated

  /auth/set-password:
    post:
      tags:
        - Authentication
      summary: Set initial password
      description: >
        Set the first password for an OIDC-created user that has none yet, and create
        their OTS account with it. Never resets an existing OTS account's password.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newPassword
              properties:
                newPassword:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: Password set and OTS account created
        '400':
          description: Invalid password, or OTS rejected the account
        '409':
          description: >
            Password already set (`code`: `password_already_set`; use change-password),
            or the username already exists on the TAK server (`code`: `username_taken_on_server`)
        '502':
          description: OTS returned an unexpected error
        '503':
          description: TAK server unreachable

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: Register a new user account with an onboarding code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
                - email
                - firstName
                - lastName
                - callsign
                - onboardingCode
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
                email:
                  type: string
                  format: email
                firstName:
                  type: string
                lastName:
                  type: string
                callsign:
                  type: string
                onboardingCode:
                  type: string
                language:
                  type: string
                  enum: [en, nl, de]
                  description: Initial profile language of the new account (the UI language used to register). Other values are ignored (default en). Stored on the pending registration and applied when the account is created (auto-approve, email verification or approval).
      responses:
        '201':
          description: User created successfully
        '400':
          description: Invalid input or onboarding code

  /auth/change-password:
    post:
      tags:
        - Authentication
      summary: Change password
      description: Change password for authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
      responses:
        '200':
          description: Password changed successfully
        '401':
          description: Current password is incorrect

  /events:
    post:
      tags:
        - Events
      summary: Create an event (events_admin only) 🔒
      description: >
        An event with playerAccessMode `shared` requires `validUntil`; the device
        accounts it creates expire with the event.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Event created
        '400':
          description: Invalid input, or playerAccessMode `shared` without validUntil

  /events/{id}:
    put:
      tags:
        - Events
      summary: Update an event (events_admin only) 🔒
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Event updated
        '400':
          description: Invalid input, or the result would be a shared event without validUntil
        '404':
          description: Event not found

  /events/join/{token}:
    post:
      tags:
        - Events
      summary: Join an event through a link token (public)
      description: >
        The link token is the credential. Leader links return a bounded leader session
        (access_token/refresh_token). Player links in individual mode return the
        onboarding code to register with. Player links in shared mode provision one OTS
        account per device and return a single-use ATAK enrollment string valid about
        15 minutes (or until the event ends). On the first call the server sets an
        HttpOnly, SameSite=Lax cookie `event_device_key` (Secure over HTTPS, Path = this
        endpoint) that identifies the device; a reload with that cookie keeps the same
        account and returns a fresh enrollment string instead of creating a new account.
        A cookie issued for another link is ignored. The response never contains a
        password.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: >
            Shared player - role, mode, team, event, expiresAt, atak ({qrString, expiresAt})
            and itak (best effort, may be null)
        '403':
          description: Events disabled, event inactive, not started or ended
        '404':
          description: Invalid or revoked link
        '409':
          description: Misconfigured link (no leader account, no registration code, or shared event without end time)
        '429':
          description: Per-team/per-event device account cap or per-link creation throttle reached
        '500':
          description: Could not provision team access or generate the enrollment

  /events/links/{id}/url:
    get:
      tags:
        - Events
      summary: Re-show the join URL of an event link (events_admin only) 🔒
      description: >
        Re-derives the join URL for links whose token is derived from SECRET_KEY
        (field `retrievable` in the link list). Legacy links with a random token,
        or any link when SECRET_KEY is weak, return 409; regenerate the link first.
        Rotating SECRET_KEY makes derived links non-retrievable (printed QRs keep working).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The join URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
        '404':
          description: Link not found
        '409':
          description: Link is not retrievable; regenerate it

  /events/{id}/accounts:
    get:
      tags:
        - Events
      summary: List the open device accounts of an event (events_admin or events_readonly) 🔒
      description: >
        Open `device` accounts plus legacy `shared` accounts (`legacy: true`, read-only).
        Each account has id (session id), otsUsername, team {id, name, color}, parked,
        createdAt, expiresAt and its euds [{callsign, uid, lastSeen}] from one OTS EUD
        listing (`eudsAvailable` is false when OTS could not be read). Never contains
        passwords or enrollment tokens.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Accounts of the event
        '404':
          description: Event not found

  /events/{id}/accounts/{sessionId}/move:
    post:
      tags:
        - Events
      summary: Move a device account to another team, or park it (events_admin only) 🔒
      description: >
        Body `{teamId: int|null}`. A team id puts the account IN+OUT in that team's OTS
        group; null parks it (OUT member of the event's `evt<id>_parked` group, which nobody
        writes into, plus IN member of `evt<id>_parked_in`, which nobody receives from; no
        team colour). Parked devices see no one and nobody sees them. The new groups are
        always joined before the old ones are left, so the device always keeps an IN and an
        OUT membership; if OTS fails the calls made (including the failing one) are reverted
        and nothing changes locally (502). Moving to the current team (or parking a parked
        account) is a 200 no-op. Sending switches to the new team immediately; receiving
        from the new team starts after the device reconnects (restart ATAK or toggle its
        connection).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The updated account
        '400':
          description: Invalid or unknown teamId, or the team has no usable OTS group
        '404':
          description: Account not found in this event
        '409':
          description: Account is closed, expired or a legacy shared account
        '502':
          description: OpenTAK Server group update failed; nothing was changed

  /events/{id}/accounts/{sessionId}/close:
    post:
      tags:
        - Events
      summary: Close a device account now (events_admin only) 🔒
      description: >
        Applies the event's accountCleanup policy (deactivate or delete), removes the
        account from its OTS groups (best-effort) and closes the session with reason
        `closed by admin`. A device that is connected stays connected until it
        reconnects. 502 when the OTS account could not be deactivated; it stays open.
        If the account was deactivated/deleted but colour or group cleanup failed, the
        session also stays open (the close job retries it) and the 502 body has
        `accountDisabled: true, cleanupPending: true`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Account closed
        '404':
          description: Account not found in this event
        '409':
          description: Account is already closed or a legacy shared account
        '502':
          description: OpenTAK Server cleanup failed; the account is still open

  /events/links/{id}/close-sessions:
    post:
      tags:
        - Events
      summary: Close all open device accounts created through a link (events_admin only) 🔒
      description: >
        Same cleanup as closing a single account, for at most 25 accounts per call.
        Returns `{closed, failed, remaining}`; `remaining` is the number of this link's
        accounts still open, so call again while it is above 0. `failed` also counts
        accounts that are disabled but whose cleanup is pending (`cleanupPending`).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Batch processed without failures (check `remaining`)
        '404':
          description: Link not found
        '502':
          description: Some accounts could not be closed and are still open

  /events/my-team:
    get:
      tags:
        - Events
      summary: Own-team view for an event leader session 🔒
      description: >
        Only for a bounded leader session (JWT issued by joining a leader link).
        Event and team are taken from the token, never from the request. Returns 403
        for any other token, when events are disabled, when the event is not open, when
        the user is no longer the team's leader, or when the leader link the session
        came from was regenerated or deleted. `playerLink` is null when the link is missing
        (an admin has to create it) or not retrievable (an admin has to regenerate it); see
        `reason`: `missing` or `notRetrievable`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Own-team data
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      validUntil:
                        type: string
                        format: date-time
                        nullable: true
                  team:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      color:
                        type: string
                        nullable: true
                  mode:
                    type: string
                    enum: [shared, individual]
                  expiresAt:
                    type: string
                    format: date-time
                    nullable: true
                  playerLink:
                    type: object
                    nullable: true
                    properties:
                      url:
                        type: string
                  reason:
                    type: string
                    enum: [missing, notRetrievable]
                    description: Present only when playerLink is null
                  atakAvailable:
                    type: boolean
        '403':
          description: Not a valid leader session for an open event

  /events/my-team/enrollment:
    post:
      tags:
        - Events
      summary: Create a new device account and its ATAK enrollment QR in the leader's team (leader session) 🔒
      description: >
        Shared mode only. Every call creates a NEW OTS account for one device in the
        leader's team (evt<eventId>_<random>) and a single-use enrollment string valid
        15 minutes (or until the event ends). Limited to 100 open device accounts per
        team (500 per event) and throttled to 10 attempts per minute for leader presses
        (separate from the player link throttle); both return 429. The response
        never contains a password (the qrString is a bearer enrollment token).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: ATAK enrollment
          content:
            application/json:
              schema:
                type: object
                properties:
                  atak:
                    type: object
                    properties:
                      qrString:
                        type: string
                        nullable: true
                      expiresAt:
                        type: integer
                        description: Unix epoch seconds
        '403':
          description: Not a valid leader session for an open event
        '409':
          description: Event is in individual mode or has no end time
        '429':
          description: Device account cap or creation throttle reached
        '500':
          description: Could not provision or generate the enrollment

  /events/my-team/accounts:
    get:
      tags:
        - Events
      summary: List all open device accounts of the leader's event (leader session) 🔒
      description: >
        Every open account of the event: all teams, parked, and legacy shared
        sessions (read-only, legacy=true). Event and team come from the leader
        token only. Never contains passwords or tokens. EUDs (callsign, uid) come
        from one OpenTAK Server listing; eudsAvailable is false when it could not
        be read. inMyTeam is true for active accounts of the leader's own team.
        For active accounts of other teams only the EUD callsign is returned
        (no uid, no lastSeen). teams lists the event's teams that can be moved to.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Accounts of the event
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        otsUsername: {type: string}
                        legacy: {type: boolean}
                        team:
                          type: object
                          nullable: true
                          properties:
                            id: {type: integer}
                            name: {type: string}
                            color: {type: string, nullable: true}
                        parked: {type: boolean}
                        inMyTeam: {type: boolean}
                        createdAt: {type: string, nullable: true}
                        expiresAt: {type: string, nullable: true}
                        euds:
                          type: array
                          items:
                            type: object
                            properties:
                              callsign: {type: string, nullable: true}
                              uid: {type: string, nullable: true}
                              lastSeen: {type: string, nullable: true}
                  eudsAvailable: {type: boolean}
                  myTeamId: {type: integer}
                  teams:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        name: {type: string}
                        color: {type: string, nullable: true}
        '403':
          description: Not a valid leader session for an open event
        '401':
          description: Missing or invalid token

  /events/my-team/accounts/{sessionId}/move:
    post:
      tags:
        - Events
      summary: Park, move or pull a device account (leader session) 🔒
      description: >
        A leader may take an account of the own team out (teamId null parks it, or
        a teamId of another team of the event moves it) and may add a PARKED
        account to the own team (teamId = own team). Accounts active in another
        team cannot be pulled; that team must park or move them first. Anything
        else is 403 (other team to own team, other to other, other to park,
        parked to another team, parked to park). Rules use the account's current state and the team in the leader
        token. Groups are added before removed and reverted on failure. Sending
        switches immediately; receiving after the device reconnects.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamId]
              properties:
                teamId:
                  type: integer
                  nullable: true
      responses:
        '200':
          description: Moved (or already in the requested state)
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    type: object
                    properties:
                      id: {type: integer}
                      otsUsername: {type: string}
                      legacy: {type: boolean}
                      team:
                        type: object
                        nullable: true
                        properties:
                          id: {type: integer}
                          name: {type: string}
                          color: {type: string, nullable: true}
                      parked: {type: boolean}
                      createdAt: {type: string, nullable: true}
                      expiresAt: {type: string, nullable: true}
        '400':
          description: Invalid or unknown teamId
        '403':
          description: Not a valid leader session, or the move is not allowed for a leader
        '404':
          description: Account not found in this event
        '409':
          description: Legacy shared account, closed account, or expired account
        '502':
          description: OpenTAK Server group update failed; nothing was changed
        '500':
          description: Could not save the change

