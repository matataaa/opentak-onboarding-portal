                  login_background_path:
                    type: string
                    description: URL of the uploaded login background image, empty when none
                    example: /api/v1/uploads/login_bg_1a2b3c4d.jpg
                  login_overlay_strength:
                    type: string
                    enum: [none, light, medium, strong]
                    example: medium
                  login_glass_enabled:
                    type: boolean
                  date_format:
                    type: string
                    enum: [eu, us, iso]
                    description: Portal-wide date/time format (eu = 31-10-2026 14:30, us = 10/31/2026 2:30 PM, iso = 2026-10-31 14:30)
