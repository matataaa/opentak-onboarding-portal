      summary: Get an OTS group with its members and usage (admin) 🔒
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Group details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  displayName:
                    type: string
                  description:
                    type: string
                  active:
                    type: boolean
                  syncedAt:
                    type: string
                    format: date-time
                    nullable: true
                  missingInOts:
                    type: boolean
                  missingSince:
                    type: string
                    format: date-time
                    nullable: true
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        username:
                          type: string
                        callsign:
                          type: string
                        email:
                          type: string
                  onboardingCodes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                  eventTeams:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
        '403':
          description: Group admin or readonly role required
        '404':
          description: Group not found
    delete:
      tags:
        - OTS Groups
      summary: Remove an OTS group (group admin) 🔒
      description: >
        A group flagged as missing in OTS is only removed from the portal (force removal).
        Otherwise it is deleted in OTS first (an OTS 404 counts as already gone); any other OTS
        failure returns 502 and keeps the local group. User and onboarding-code assignments are
        removed with the group and event teams are detached from it.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Group removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  removedFromOts:
                    type: boolean
                  affected:
                    type: object
                    properties:
                      memberCount:
                        type: integer
                      onboardingCodes:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                      eventTeams:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
        '403':
          description: Group admin role required
        '404':
          description: Group not found
        '502':
          description: Deleting the group in OTS failed; the local group is kept

