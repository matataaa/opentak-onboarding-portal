[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --tb=short
markers =
    upgrade: opt-in upgrade-path tests (set RUN_UPGRADE_TESTS=1; UPGRADE_TEST_PG_URL adds PostgreSQL)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
